name: Validate skill and plugin

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate bundle
        run: python scripts/validate.py
      - name: Verify skills CLI discovery
        run: npx --yes skills@1.5.23 add . --list
      - name: Check whitespace
        run: git show --format= --check HEAD
